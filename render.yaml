# Render Blueprint (New > Blueprint): free web service built from the Dockerfile's
# final stage (prod). Postgres lives on Neon and e-mail goes through Brevo, see
# README "Deploying (Render + Neon + e-mail API)". Variables with sync: false are
# asked for when the Blueprint is created.
services:
  - type: web
    name: financial-app-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      # Per-IP rate limits: Render's Cloudflare edge sets the visitor's IP here
      # (requests that try to forge it are rejected at the edge).
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      # E-mail through Brevo (no domain needed, verified sender). With a verified domain,
      # RESEND_API_KEY (Resend) can be added instead; it takes precedence.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
